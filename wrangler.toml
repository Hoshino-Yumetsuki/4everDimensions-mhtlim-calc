name = "4everdimensions-mhtlim-calc"
main = "workers/index.js"
compatibility_date = "2026-10-23"
# PHP's Cloudflare build must not detect the Node.js process polyfill.
compatibility_flags = ["no_nodejs_compat", "no_nodejs_compat_v2"]
workers_dev = false
preview_urls = false

[build]
command = "yarn build"
watch_dir = [
  "workers", "scripts", "user", "includes", "wtf", "index.php", "ui.php", "floating.php", "fc.php", "changelog.php",
  "files", "js", "layui", "resources", "RubbishBin", "static", "story", "usage", "wiki",
  "authors.txt", "favicon.ico", "importantNotice.txt", "lang.json", "licenseAndPrivacy.txt",
  "new_UI.css", "new_ui.js", "pic.js", "prefedit.html", "robots.txt", "sitemap.xml",
  "table.html", "tips.txt", "tips_html.txt", "up.txt", "version.txt"
]

[assets]
directory = "./dist/assets"
binding = "ASSETS"
run_worker_first = ["/", "/*.php"]
not_found_handling = "none"

[observability.logs]
enabled = false
invocation_logs = true
